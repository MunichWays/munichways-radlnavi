name: Routing regression tests
on:
  pull_request:
    paths: ['backend/**', 'routing/**', 'cloudbuild*.yaml', 'compose*.yaml', '.github/workflows/routing-tests.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install poetry
      - working-directory: backend
        run: |
          poetry install --only main --no-root
          poetry run python -m unittest discover -s tests
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Guidance way classification
        run: |
          python -m pip install lupa==2.6
          python routing/tests/test_guidance_way_type.py
      - run: |
          docker build -t profile-standard -f routing/tests/Dockerfile routing
          docker build --build-arg ROUTING_PROFILE=direct -t profile-direct -f routing/tests/Dockerfile routing
          docker run -d --name standard -p 18081:8080 profile-standard
          docker run -d --name direct -p 18082:8080 profile-direct
          for port in 18081 18082; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://localhost:$port/route/v1/bike/11,48.6;11.002,48.6?overview=false" > /dev/null; then
                break
              fi
              sleep 1
            done
          done
          python routing/tests/test_profile_regressions.py
          python routing/tests/test_direct_profile.py
          python routing/tests/test_guidance_classes.py
      - name: Munich one-way regressions
        run: |
          docker build --build-arg FIXTURE=tests/fixtures/munich-oneway.osm -t munich-standard -f routing/tests/Dockerfile routing
          docker build --build-arg FIXTURE=tests/fixtures/munich-oneway.osm --build-arg ROUTING_PROFILE=direct -t munich-direct -f routing/tests/Dockerfile routing
          docker run -d --name munich-standard -p 18083:8080 munich-standard
          docker run -d --name munich-direct -p 18084:8080 munich-direct
          for port in 18083 18084; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://localhost:$port/route/v1/bike/11.554569,48.142131;11.562248,48.141745?overview=false" > /dev/null; then
                break
              fi
              sleep 1
            done
            python routing/tests/test_munich_oneway.py --endpoint "http://localhost:$port"
          done
