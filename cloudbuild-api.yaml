substitutions:
  _REGION: europe-west3
  _REPOSITORY: radlnavi
  _ROUTING_SERVICE: munichways-radlnavi-routing
  _API_SERVICE: munichways-radlnavi-api
  _DIRECT_API_SERVICE: munichways-radlnavi-direct-api

steps:
  - name: gcr.io/cloud-builders/git
    id: checkout-source
    entrypoint: bash
    args:
      - -ceu
      - |
        git clone https://github.com/MunichWays/munichways-radlnavi.git /workspace/source
        cd /workspace/source
        git checkout "$COMMIT_SHA"

  - name: gcr.io/cloud-builders/docker
    id: build-api
    waitFor: [checkout-source]
    dir: source
    entrypoint: bash
    args:
      - -ceu
      - |
        backend_version="$$(tr -d '\r\n' < backend/VERSION)"
        docker build \
          --build-arg="VERSION=$${backend_version}" \
          --build-arg="COMMIT=$COMMIT_SHA" \
          -t '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA' \
          -f backend/Dockerfile backend

  - name: gcr.io/cloud-builders/docker
    id: push-api
    waitFor: [build-api]
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-api
    waitFor: [push-api]
    entrypoint: bash
    args:
      - -ceu
      - |
        routing_url="$$(gcloud run services describe '${_ROUTING_SERVICE}' --region '${_REGION}' --format='value(status.url)')"
        gcloud run deploy '${_API_SERVICE}' \
          --image='${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA' \
          --region='${_REGION}' \
          --service-account='radlnavi-api@$PROJECT_ID.iam.gserviceaccount.com' \
          --allow-unauthenticated \
          --min-instances=0 \
          --max-instances=2 \
          --memory=1Gi \
          --cpu=1 \
          --concurrency=20 \
          --timeout=60 \
          --update-env-vars="OSRM_BACKEND_URL=$${routing_url},OSRM_AUTH_AUDIENCE=$${routing_url},SHARED_ROUTES_BUCKET=$PROJECT_ID-shared-routes,SHARE_PUBLIC_BASE_URL=https://radlnavi.munichways.de,CORS_ORIGINS=https://radlnavi.munichways.de;https://api.radlnavi.munichways.de;https://munichways-radlnavi-prod.web.app"

  # The private bucket and API bucket permissions are a one-time prerequisite:
  # backend/configure_route_sharing.ps1. Do not grant storage-admin to the builder.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: verify-route-sharing
    waitFor: [deploy-api]
    dir: source
    entrypoint: bash
    args:
      - -ceu
      - |
        api_url="$$(gcloud run services describe '${_API_SERVICE}' --region '${_REGION}' --format='value(status.url)')"
        python3 backend/check_route_sharing_deployment.py --endpoint="$${api_url}"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: refresh-direct-api
    waitFor: [deploy-api]
    dir: source
    entrypoint: python3
    args:
      - backend/sync_direct_api.py
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --standard=${_API_SERVICE}
      - --direct=${_DIRECT_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

serviceAccount: projects/$PROJECT_ID/serviceAccounts/radlnavi-build@$PROJECT_ID.iam.gserviceaccount.com

timeout: 3600s
