name: Routing build

on:
  schedule:
    # Sunday 03:15 UTC (04:15 CET / 05:15 CEST)
    - cron: "15 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: weekly-routing-build
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/264044299735/locations/global/workloadIdentityPools/github-actions/providers/github-munichways
          service_account: radlnavi-github@munichways-radlnavi-prod.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and deploy routing
        run: >-
          gcloud builds submit --no-source
          --project=munichways-radlnavi-prod
          --config=routing/cloudbuild.yaml
          --substitutions=COMMIT_SHA=${GITHUB_SHA}
