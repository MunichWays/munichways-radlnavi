worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log /dev/stdout;
    error_log /dev/stderr;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Use one authoritative server, independent of the base image's sites.
    # /r/<id> must reach React on a direct page load, including without the app.
    server {
        listen 80;
        server_name _;
        root /var/www/html;
        location /layers/ { try_files $uri =404; }
        location = /street-details/manifest.json {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
        location /street-details/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location /static/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
