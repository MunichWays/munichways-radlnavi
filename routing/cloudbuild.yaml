substitutions:
  _REGION: europe-west3
  _REPOSITORY: radlnavi
  _ROUTING_SERVICE: munichways-radlnavi-routing
  _API_SERVICE: munichways-radlnavi-api

steps:
  - name: gcr.io/cloud-builders/git
    id: checkout-source
    entrypoint: bash
    args:
      - -ceu
      - |
        git clone https://github.com/MunichWays/munichways-radlnavi.git /workspace/source
        cd /workspace/source
        git checkout "$COMMIT_SHA"

  - name: gcr.io/cloud-builders/docker
    id: build-routing
    waitFor: [checkout-source]
    dir: source
    entrypoint: bash
    args:
      - -ceu
      - |
        routing_version="$$(tr -d '\r\n' < routing/VERSION)"
        docker build \
          --build-arg="RADLNAVI_ROUTING_DATE=$BUILD_ID" \
          --build-arg="VERSION=$${routing_version}" \
          -t '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/routing:$COMMIT_SHA' \
          -f routing/Dockerfile routing

  - name: gcr.io/cloud-builders/docker
    id: push-routing
    waitFor: [build-routing]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/routing:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-routing
    waitFor: [push-routing]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_ROUTING_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/routing:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=radlnavi-routing@$PROJECT_ID.iam.gserviceaccount.com
      - --no-allow-unauthenticated
      - --min-instances=0
      - --max-instances=1
      - --memory=2Gi
      - --cpu=1
      - --concurrency=20
      - --timeout=60

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: publish-routing-version
    waitFor: [deploy-routing]
    dir: source
    entrypoint: bash
    args:
      - -ceu
      - |
        routing_version="$$(tr -d '\r\n' < routing/VERSION)"
        gcloud run services update '${_API_SERVICE}' \
          --region='${_REGION}' \
          --update-env-vars="ROUTING_VERSION=$${routing_version},ROUTING_COMMIT=$COMMIT_SHA,OSRM_VERSION=26.6.5"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/routing:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

serviceAccount: projects/$PROJECT_ID/serviceAccounts/radlnavi-build@$PROJECT_ID.iam.gserviceaccount.com

timeout: 3600s
