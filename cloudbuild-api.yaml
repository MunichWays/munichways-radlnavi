substitutions:
  _REGION: europe-west3
  _REPOSITORY: radlnavi
  _ROUTING_SERVICE: munichways-radlnavi-routing
  _API_SERVICE: munichways-radlnavi-api

steps:
  - name: gcr.io/cloud-builders/git
    id: checkout-source
    entrypoint: bash
    args:
      - -ceu
      - |
        git clone https://github.com/MunichWays/munichways-radlnavi.git /workspace/source
        cd /workspace/source
        git checkout "$COMMIT_SHA"

  - name: gcr.io/cloud-builders/docker
    id: build-api
    waitFor: [checkout-source]
    dir: source
    entrypoint: bash
    args:
      - -ceu
      - |
        backend_version="$$(tr -d '\r\n' < backend/VERSION)"
        docker build \
          --build-arg="VERSION=$${backend_version}" \
          -t '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA' \
          -f backend/Dockerfile backend

  - name: gcr.io/cloud-builders/docker
    id: push-api
    waitFor: [build-api]
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-api
    waitFor: [push-api]
    entrypoint: bash
    args:
      - -ceu
      - |
        routing_url="$$(gcloud run services describe '${_ROUTING_SERVICE}' --region '${_REGION}' --format='value(status.url)')"
        gcloud run deploy '${_API_SERVICE}' \
          --image='${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA' \
          --region='${_REGION}' \
          --service-account='radlnavi-api@$PROJECT_ID.iam.gserviceaccount.com' \
          --allow-unauthenticated \
          --min-instances=0 \
          --max-instances=2 \
          --memory=512Mi \
          --cpu=1 \
          --concurrency=20 \
          --timeout=60 \
          --update-env-vars="OSRM_BACKEND_URL=$${routing_url},OSRM_AUTH_AUDIENCE=$${routing_url},CORS_ORIGINS=https://radlnavi.munichways.de;https://api.radlnavi.munichways.de;https://munichways-radlnavi-prod.web.app"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

serviceAccount: projects/$PROJECT_ID/serviceAccounts/radlnavi-build@$PROJECT_ID.iam.gserviceaccount.com

timeout: 3600s
