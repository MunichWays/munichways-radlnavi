238">K07 bleibt zurückgestellt. Radfahrstreifen fehlen in der bisherigen Erfassung. Thomas hat das Mapping in OSM korrigiert; der eingefrorene</text><text x="28" y="1053" font-family="Arial,sans-serif" font-size="14" fill="#263238">Datensatz enthält diese Änderung noch nicht nachweislich.</text></svg>