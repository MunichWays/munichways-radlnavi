name: Deploy frontend

on:
  workflow_dispatch:
  schedule:
    # After the Sunday/Monday V20 publication; daily checks also catch late runs.
    # 09:23 CET / 10:23 CEST. Unchanged snapshots do not trigger a build.
    - cron: "23 8 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: manual-frontend-deploy
  cancel-in-progress: false

jobs:
  check-data-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.v20.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Compare published V20 with deployed snapshot
        id: v20
        if: github.event_name == 'schedule'
        run: node frontend/check_street_details_update.mjs

  build-and-deploy:
    needs: check-data-update
    if: github.event_name != 'schedule' || needs.check-data-update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/264044299735/locations/global/workloadIdentityPools/github-actions/providers/github-munichways
          service_account: radlnavi-github@munichways-radlnavi-prod.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and deploy frontend
        run: >-
          gcloud builds submit --no-source
          --project=munichways-radlnavi-prod
          --region=europe-west3
          --config=cloudbuild-frontend.yaml
          --substitutions=COMMIT_SHA=${GITHUB_SHA}
