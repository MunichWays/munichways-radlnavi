name: Routing regression tests
on:
  pull_request:
    paths: ['backend/**', 'routing/**', 'cloudbuild*.yaml', 'compose*.yaml', '.github/workflows/routing-tests.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install poetry
      - working-directory: backend
        run: |
          poetry install --only main --no-root
          poetry run python -m unittest discover -s tests
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guidance way classification
        run: |
          python -m pip install lupa==2.6 osmium==3.7.0
          python routing/tests/test_guidance_way_type.py
          python routing/tests/test_cycling_attributes.py
      - run: |
          docker build -t profile-standard -f routing/tests/Dockerfile routing
          docker build --build-arg ROUTING_PROFILE=direct -t profile-direct -f routing/tests/Dockerfile routing
          docker run -d --name standard -p 18081:8080 profile-standard
          docker run -d --name direct -p 18082:8080 profile-direct
          for port in 18081 18082; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://localhost:$port/route/v1/bike/11,48.6;11.002,48.6?overview=false" > /dev/null; then
                break
              fi
              sleep 1
            done
          done
          python routing/tests/test_profile_regressions.py
          python routing/tests/test_direct_profile.py
          python routing/tests/test_cycleway_tags.py
          python routing/tests/test_guidance_classes.py
      - name: Directional cycling attributes and Munich examples
        run: |
          fixture=tests/fixtures/cycling-attributes.osm
          docker build --build-arg FIXTURE="$fixture" -t attributes-standard -f routing/tests/Dockerfile routing
          docker build --build-arg FIXTURE="$fixture" --build-arg ROUTING_PROFILE=direct -t attributes-direct -f routing/tests/Dockerfile routing
          docker run -d --name attributes-standard -p 18089:8080 attributes-standard
          docker run -d --name attributes-direct -p 18090:8080 attributes-direct
          for port in 18089 18090; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://localhost:$port/route/v1/bike/11,50;11.001,50?overview=false" > /dev/null; then
                break
              fi
              sleep 1
            done
          done
          python routing/tests/test_sided_cycleway_tags.py
      - name: Munich one-way regressions
        run: |
          docker build --build-arg FIXTURE=tests/fixtures/munich-oneway.osm -t munich-standard -f routing/tests/Dockerfile routing
          docker build --build-arg FIXTURE=tests/fixtures/munich-oneway.osm --build-arg ROUTING_PROFILE=direct -t munich-direct -f routing/tests/Dockerfile routing
          docker run -d --name munich-standard -p 18083:8080 munich-standard
          docker run -d --name munich-direct -p 18084:8080 munich-direct
          for port in 18083 18084; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://localhost:$port/route/v1/bike/11.554569,48.142131;11.562248,48.141745?overview=false" > /dev/null; then
                break
              fi
              sleep 1
            done
            python routing/tests/test_munich_oneway.py --endpoint "http://localhost:$port"
          done
      - name: Endpoint pushing access with unchanged bicycle profiles
        run: |
          docker build --build-arg FIXTURE=tests/fixtures/munich-endpoint-access.osm -t endpoint-standard -f routing/tests/Dockerfile routing
          docker build --build-arg FIXTURE=tests/fixtures/munich-endpoint-access.osm --build-arg ROUTING_PROFILE=direct -t endpoint-direct -f routing/tests/Dockerfile routing
          docker run -d --name endpoint-standard -p 18085:8080 endpoint-standard
          docker run -d --name endpoint-direct -p 18086:8080 endpoint-direct
          for port in 18085 18086; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://localhost:$port/route/v1/bike/11.563063,48.1415279;11.5642517,48.1426711?overview=false" > /dev/null; then
                break
              fi
              sleep 1
            done
          done
          python routing/tests/test_endpoint_access.py
      - name: Bergmannstraße crossing guidance
        run: |
          fixture=tests/fixtures/bergmann-landsberger-2026-10-13.osm
          docker build --build-arg FIXTURE="$fixture" -t bergmann-standard -f routing/tests/Dockerfile routing
          docker build --build-arg FIXTURE="$fixture" --build-arg ROUTING_PROFILE=direct -t bergmann-direct -f routing/tests/Dockerfile routing
          docker run -d --name bergmann-standard -p 18087:8080 bergmann-standard
          docker run -d --name bergmann-direct -p 18088:8080 bergmann-direct
          for port in 18087 18088; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://localhost:$port/route/v1/bike/11.537721,48.138255;11.538348,48.140515?steps=true&overview=false" > /dev/null; then
                break
              fi
              sleep 1
            done
            python routing/tests/test_bergmann_guidance.py --endpoint "http://localhost:$port"
          done
